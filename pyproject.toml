[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-piper"
version = "0.1.0"
description = "Pipe analog audio (RCA/3.5mm line-in) from a Pi/OrangePi to Bluetooth, AirPlay, or Sonos."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "pi-piper contributors" }]
requires-python = ">=3.10"
keywords = ["audio", "bluetooth", "airplay", "sonos", "raspberrypi", "orangepi", "alsa"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
]
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "soco>=0.30",
    "pyatv>=0.15",
    "zeroconf>=0.131",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
pi-piper = "pi_piper.cli:main"
pi-piperd = "pi_piper.service:main"

[project.urls]
Homepage = "https://github.com/tsonubin/pi-piper"
Issues = "https://github.com/tsonubin/pi-piper/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pi_piper = ["data/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
